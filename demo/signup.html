<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 · 모아쓰기 데모</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="demo-bar">
    <div><b>DEMO</b><span>고정된 예시 데이터로 화면 흐름만 보여줍니다.</span></div>
    <div class="demo-switch" aria-label="데모 흐름 선택">
      <button class="active" data-role="host">진행자 흐름</button>
      <button data-role="guest">참가자 흐름</button>
    </div>
  </div>
  <header class="app-header">
    <button class="brand" data-go="landing" aria-label="홈으로"><span>모아쓰기</span></button>
    <div class="header-topic" id="headerTopic" hidden>신규 서비스 아이디어</div>
    <div class="account" id="account">진행자 김모아 ▾</div>
  </header>
  <main>
    <section class="screen active auth-screen" data-screen="signup">
      <div class="auth-card">
        <button class="text-link back" data-go="login">← 로그인으로</button>
        <span class="eyebrow">새 계정</span><h2>함께할 준비를 시작해요.</h2>
        <p class="muted">계정을 만들면 안건을 열고, 참여한 안건을 다시 확인할 수 있어요.</p>
        <label>아이디<div class="fake-input">moa2026</div><span class="field-help">사용할 아이디를 입력해 주세요.</span></label>
        <label>비밀번호<div class="fake-input">•••••••• <span>◉</span></div><span class="field-help">비밀번호를 입력해 주세요.</span></label>
        <label>비밀번호 확인<div class="fake-input">•••••••• <span>◉</span></div></label>
        <button class="btn primary wide" data-go="landing">가입하기</button>
        <p class="auth-foot">이미 계정이 있나요? <button class="text-link" data-go="login">로그인</button></p>
      </div>
    </section>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script src="./app.js?v=5"></script>
</body>
</html>
