<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>예외 화면 · 모아쓰기 데모</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="demo-bar">
    <div><b>DEMO</b><span>고정된 예시 데이터로 화면 흐름만 보여줍니다.</span></div>
    <div class="demo-switch" aria-label="데모 흐름 선택">
      <button class="active" data-role="host">진행자 흐름</button>
      <button data-role="guest">참가자 흐름</button>
    </div>
  </div>
  <header class="app-header">
    <button class="brand" data-go="landing" aria-label="홈으로"><span>모아쓰기</span></button>
    <div class="header-topic" id="headerTopic" hidden>신규 서비스 아이디어</div>
    <div class="account" id="account">진행자 김모아 ▾</div>
  </header>
  <main>
    <section class="screen active app-screen narrow" data-screen="demoState">
      <button class="text-link back" data-go="landing">← 홈으로</button>
      <div class="state-layout">
        <article class="state-card">
          <span class="state-mark" aria-hidden="true">!</span>
          <span class="eyebrow" id="stateEyebrow">접근 오류</span>
          <h1 id="stateTitle">공유 링크를 찾을 수 없어요.</h1>
          <p id="stateBody">링크 주소를 확인해 주세요.</p>
          <button class="btn primary" id="stateAction" data-go="landing">홈으로</button>
        </article>
      </div>
    </section>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script src="./app.js?v=5"></script>
</body>
</html>
