openapi: 3.0.3
info:
  title: 모아쓰기 API
  version: 1.0.0
  description: |-
    독립 작성·익명 평가·평가 분포·최종 채택을 지원하는 최소 API 계약입니다.
    계정·JWT 없이 안건 생성/참가 시 랜덤 키를 발급합니다. 참가자와 진행자 확인에는 X-Participant-Token 하나를 사용합니다. 키 만료·복구는 없습니다.
    GET 안건 조회는 키가 선택 사항이며, 키 없이 조회하면 비참가자 viewer입니다. 공개 결과 조회는 키가 필요 없습니다.
    단계는 WRITING → EVALUATING → RESULT이며 진행자가 수동 전환합니다. 자동 마감·스케줄러·되돌리기 없음. 채택 후에도 RESULT입니다.
    아이디어는 참가자당 1개. 작성 중 다른 아이디어는 숨기며 삭제 없음. 평가 클릭 시 저장하고 자기 아이디어 평가·중간 집계 공개는 금지합니다.
    아이디어 0개면 평가 시작 거부. 평가 0건이면 아이디어는 표시하고 분포 대신 평가 없음 안내. 채택 가능.
    오류는 HTTP 상태와 message만 사용하며 세부 오류코드·fieldErrors 체계는 없습니다.
    닉네임 중복은 같은 안건에서 금지하며 세부 비교 규칙은 구현 시 확인합니다. 남기는 API의 operationId·tag는 유지합니다.
servers:
- url: http://localhost:8080/api
  description: 로컬 개발 서버
tags:
- name: Session
  description: 안건 생성·조회와 수동 단계 전환
- name: Participant
  description: 안건 참가와 참가자 조회
- name: Idea
  description: 참가자당 단일 아이디어 저장·수정
- name: Evaluation
  description: 평가 대상 조회와 평가 저장
- name: Result
  description: 평가 결과 조회와 최종 채택
paths:
  /sessions:
    post:
      tags:
      - Session
      summary: 안건 생성
      description: 제목·설명과 진행자 닉네임으로 안건을 만듭니다. 진행자 참가자와 랜덤 키를 함께 생성합니다. 로그인과 마감시각은 필요하지 않습니다.
      operationId: createSession
      security: []
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
  /sessions/{sessionId}:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    get:
      tags:
      - Session
      summary: 안건 조회
      description: 공유 링크로 현재 안건과 단계를 조회합니다. 키 없이 조회하면 viewer는 비참가자입니다. X-Participant-Token을 보내면 해당 안건의 현재 참가자를 확인합니다.
        잘못된 키를 보낸 경우 401입니다.
      operationId: getSession
      security:
      - {}
      - participantToken: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sessions/{sessionId}/participants:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    post:
      tags:
      - Participant
      summary: 닉네임으로 참가
      description: WRITING에서만 신규 참가할 수 있습니다. 같은 안건의 닉네임 중복은 거부합니다. 닉네임 비교 세부 방식은 구현 전에 확인합니다. 만료 없는 랜덤 참가 키를 발급하며
        분실 시 복구·기록 이전은 없습니다.
      operationId: joinSession
      security: []
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinSessionRequest'
    get:
      tags:
      - Participant
      summary: 참가자 목록 조회
      description: 진행자 관리 영역에서 닉네임과 진행자 여부를 표시합니다. 완료 인원이나 작성·평가 완료 상태는 반환하지 않습니다.
      operationId: getParticipants
      security:
      - participantToken: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParticipantSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sessions/{sessionId}/ideas:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    put:
      tags:
      - Idea
      summary: 내 아이디어 저장·수정
      description: 현재 참가자의 아이디어 하나를 저장하거나 수정합니다. WRITING에서만 가능하며 공백 내용은 거부합니다. 참가자당 1개를 유지하므로 재요청이 새 아이디어를 추가하지
        않습니다. 삭제 기능은 없습니다.
      operationId: putIdea
      security:
      - participantToken: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Idea'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdeaWriteRequest'
  /sessions/{sessionId}/ideas/me:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    get:
      tags:
      - Idea
      summary: 내 아이디어 조회
      description: 현재 참가자가 저장한 아이디어 0~1개를 반환합니다. 기존 경로와 operationId를 유지합니다. 다른 참가자의 아이디어는 포함하지 않습니다.
      operationId: getMyIdeas
      security:
      - participantToken: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Idea'
                maxItems: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sessions/{sessionId}/close-writing:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    post:
      tags:
      - Session
      summary: 평가 시작
      description: 진행자가 WRITING을 EVALUATING으로 전환합니다. 아이디어가 0개면 409로 거부하고 WRITING을 유지합니다. 신규 참가와 아이디어 저장·수정은 전환 후
        불가합니다. 자동 마감과 되돌리기는 없습니다.
      operationId: closeWriting
      security:
      - participantToken: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sessions/{sessionId}/evaluation-items:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    get:
      tags:
      - Evaluation
      summary: 익명 평가 대상 조회
      description: EVALUATING에서 본인 아이디어를 제외한 익명 아이디어와 내 평가를 조회합니다. 작성자·다른 사람의 평가·중간 집계는 공개하지 않습니다. 본인 아이디어만 있으면
        빈 목록입니다.
      operationId: getEvaluationItems
      security:
      - participantToken: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvaluationItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sessions/{sessionId}/evaluations:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    put:
      tags:
      - Evaluation
      summary: 평가 선택 저장·변경
      description: 좋음/괜찮음/별로를 선택할 때마다 호출합니다. 현재 참가자와 ideaId 조합으로 저장하고 기존 평가가 있으면 값을 변경합니다. EVALUATING에서만 가능하며 같은
        안건의 남의 아이디어만 평가할 수 있습니다.
      operationId: putEvaluation
      security:
      - participantToken: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationWriteRequest'
  /sessions/{sessionId}/close-evaluation:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    post:
      tags:
      - Session
      summary: 평가 종료·결과 공개
      description: 진행자가 EVALUATING을 RESULT로 전환합니다. 평가 0건이어도 가능합니다. 이후 평가 저장·변경은 불가합니다. 자동 마감과 되돌리기는 없습니다.
      operationId: closeEvaluation
      security:
      - participantToken: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sessions/{sessionId}/results:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    get:
      tags:
      - Result
      summary: 평가 분포와 채택 결과 조회
      description: RESULT에서 공유 링크로 조회합니다. 생성순 아이디어를 반환하고 점수·순위는 없습니다. 평가 total이 0인 아이디어도 표시하되 화면에서는 분포 대신 평가 없음을
        안내합니다. 채택된 아이디어의 작성자 닉네임만 공개합니다.
      operationId: getResults
      security: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sessions/{sessionId}/select-idea:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    post:
      tags:
      - Result
      summary: 아이디어 채택
      description: 진행자가 RESULT에서 해당 안건의 아이디어 하나를 채택합니다. 평가가 없어도 채택할 수 있습니다. 한 번 채택하면 변경할 수 없으며 상태는 RESULT를 유지합니다.
      operationId: selectIdea
      security:
      - participantToken: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectIdeaRequest'
components:
  securitySchemes:
    participantToken:
      type: apiKey
      in: header
      name: X-Participant-Token
      description: 진행자와 참가자 모두 사용하는 안건별 랜덤 키. JWT가 아니며 만료·복구 없음.
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      description: 안건 식별자
      schema:
        type: string
        format: uuid
  schemas:
    SessionStatus:
      type: string
      description: 수동 전환하는 세 단계. 채택 후에도 RESULT.
      enum:
      - WRITING
      - EVALUATING
      - RESULT
    SessionCreateRequest:
      type: object
      required:
      - title
      - nickname
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
        nickname:
          type: string
          minLength: 1
          maxLength: 30
          description: 공백뿐인 값은 거부하고 같은 안건 안에서 중복을 금지합니다. 공백 정규화·대소문자 비교 방식은 구현 때 확인합니다.
    SessionCreateResponse:
      type: object
      required:
      - session
      - participant
      - reconnectToken
      properties:
        session:
          $ref: '#/components/schemas/SessionDetail'
        participant:
          $ref: '#/components/schemas/ParticipantSummary'
        reconnectToken:
          type: string
          description: 진행자 참가 키. 브라우저에 보관하고 공유 URL·QR에 넣지 않습니다.
    SessionDetail:
      type: object
      required:
      - id
      - title
      - description
      - status
      - selectedIdeaId
      - viewer
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/SessionStatus'
        selectedIdeaId:
          type: string
          format: uuid
          nullable: true
        viewer:
          $ref: '#/components/schemas/SessionViewer'
    SessionViewer:
      type: object
      required:
      - isHost
      - isParticipant
      - participantId
      - nickname
      properties:
        isHost:
          type: boolean
        isParticipant:
          type: boolean
        participantId:
          type: string
          format: uuid
          nullable: true
        nickname:
          type: string
          nullable: true
      description: 키 없이 조회하면 false/false/null/null. 진행자는 참가자이기도 합니다.
    JoinSessionRequest:
      type: object
      required:
      - nickname
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 30
          description: 공백뿐인 값은 거부하고 같은 안건 안에서 중복을 금지합니다. 공백 정규화·대소문자 비교 방식은 구현 때 확인합니다.
    JoinSessionResponse:
      type: object
      required:
      - participant
      - reconnectToken
      properties:
        participant:
          $ref: '#/components/schemas/ParticipantSummary'
        reconnectToken:
          type: string
          description: 안건별 랜덤 참가 키. 만료·복구 없음.
    ParticipantSummary:
      type: object
      required:
      - id
      - nickname
      - isHost
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
        isHost:
          type: boolean
    IdeaWriteRequest:
      type: object
      required:
      - content
      properties:
        content:
          type: string
          minLength: 1
          description: 공백만 있는 내용은 거부합니다. ID 없이 현재 참가자의 단일 아이디어를 저장·수정합니다.
    Idea:
      type: object
      required:
      - id
      - content
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
    EvaluationItem:
      type: object
      required:
      - ideaId
      - content
      - myEvaluation
      properties:
        ideaId:
          type: string
          format: uuid
        content:
          type: string
        myEvaluation:
          type: integer
          enum:
          - -1
          - 0
          - 1
          description: 현재 참가자의 평가. 아직 평가하지 않았으면 null.
          nullable: true
    EvaluationWriteRequest:
      type: object
      required:
      - ideaId
      - value
      properties:
        ideaId:
          type: string
          format: uuid
        value:
          type: integer
          enum:
          - -1
          - 0
          - 1
          description: 좋음 1, 괜찮음 0, 별로 -1
    Evaluation:
      type: object
      required:
      - ideaId
      - value
      properties:
        ideaId:
          type: string
          format: uuid
        value:
          type: integer
          enum:
          - -1
          - 0
          - 1
          description: 좋음 1, 괜찮음 0, 별로 -1
    SelectIdeaRequest:
      type: object
      required:
      - ideaId
      properties:
        ideaId:
          type: string
          format: uuid
    ResultResponse:
      type: object
      required:
      - sessionId
      - status
      - selectedIdeaId
      - ideas
      properties:
        sessionId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - RESULT
        selectedIdeaId:
          type: string
          format: uuid
          nullable: true
        ideas:
          type: array
          items:
            $ref: '#/components/schemas/IdeaResult'
          minItems: 1
      description: アイ디어 0개이면 평가를 시작할 수 없으므로 별도 빈 결과 상태는 없습니다.
    IdeaResult:
      type: object
      required:
      - ideaId
      - content
      - authorNickname
      - distribution
      - selected
      properties:
        ideaId:
          type: string
          format: uuid
        content:
          type: string
        authorNickname:
          type: string
          nullable: true
          description: 채택된 아이디어에만 작성자 닉네임. 나머지는 null.
        distribution:
          $ref: '#/components/schemas/EvaluationDistribution'
        selected:
          type: boolean
    EvaluationDistribution:
      type: object
      required:
      - positive
      - neutral
      - negative
      - total
      properties:
        positive:
          type: integer
          minimum: 0
        neutral:
          type: integer
          minimum: 0
        negative:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
      description: 저장된 평가만 집계. total = positive + neutral + negative. total 0이면 화면에서 분포 대신 평가 없음 표시.
    Error:
      type: object
      required:
      - message
      properties:
        message:
          type: string
          example: 요청을 처리할 수 없습니다.
  responses:
    BadRequest:
      description: 요청 형식 또는 입력값 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 참가 키가 없거나 해당 안건의 유효한 키가 아님
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 진행자 권한 없음 또는 자기 아이디어 평가 등 허용하지 않는 행동
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 안건·참가자·아이디어를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 단계 불일치, 닉네임 중복, 아이디어 없는 평가 시작 또는 이미 채택됨
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: 예상하지 못한 서버 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
