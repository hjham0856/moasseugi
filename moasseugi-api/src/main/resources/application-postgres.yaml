# local,postgres 순서로 활성화해 로컬 CORS는 유지하고 DB 설정만 덮어쓴다.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/moasseugi}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:moasseugi}
    password: ${DB_PASSWORD:moasseugi}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      # 로컬 데이터를 유지한다. 컬럼 삭제·이름 변경은 자동으로 반영되지 않는다.
      ddl-auto: update
